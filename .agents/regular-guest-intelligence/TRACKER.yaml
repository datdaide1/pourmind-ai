  - id: RCP-02
    epic: recipes
    status: completed
    plan: "tasks/rcp-02-adapt-cost-and-abv-calculator-to-normalized-recipes.yaml"
    completed_at: "2026-08-20"
    evidence:
      implementation:
        - "app/tools/cost_abv_calculator.py: new calculate_recipe_cost_and_abv() accepts RCP-01-normalized ingredient lines (IngredientLine-shaped dicts or model instances) with mixed units"
        - "Legacy calculate_cost_and_abv() (used by the chat agent's calculate_cost_tool in app/agents/nodes.py) is untouched byte-for-byte; the new function is additive"
        - "total_volume_ml sums only ml-unit lines; dash/drop/barspoon/piece have no approved conversion (RCP-01) and are structurally excluded, reported in missing_data, but never block the ml-based aggregate"
        - "estimated_abv and estimated_cost_vnd are computed from the ml-unit set only when every one of those ingredients has a known ABV/price; a single unknown component nulls the aggregate instead of silently understating it, so no value is ever fabricated"
        - "Per-ingredient breakdown records abv_source/price_source (ingredients_table, liquor_prices_table, unit_not_volume_based, or unknown) for input provenance, plus calculation_version = 'recipe-cost-abv-v1'"
        - "Invalid/unparseable amounts are excluded and reported rather than crashing or defaulting to 0"
        - "RecipeCostAbvResult.as_dict() exposes field names matching the FND-02 RecipeVersion/RecipeSnapshot contract (total_volume_ml, estimated_abv, estimated_cost_vnd, missing_data) for direct use by RCP-03"
      regression_coverage:
        - "tests/test_recipe_cost_abv_calculator.py: known-ingredient exact totals, case/whitespace-insensitive lookup, missing ABV, missing price, one unknown ingredient nulling the recipe-wide aggregate, all four non-ml units excluded without blocking the known-ml aggregate, an all-non-ml recipe (no volume totals), empty ingredient list, invalid/zero/negative amounts, IngredientLine model-instance input, and the as_dict() field-name contract"
        - "tests/test_tools.py (legacy calculate_cost_and_abv tests) re-run unmodified to confirm no regression"
      validation:
        - command: "E:/anaconda3/envs/cocktail-ai/python.exe -m pytest tests/test_recipe_cost_abv_calculator.py -q"
          result: "post-review passed: 20 tests"
        - command: "E:/anaconda3/envs/cocktail-ai/python.exe -m compileall -q app tests"
          result: "passed"
        - command: "E:/anaconda3/envs/cocktail-ai/python.exe -m pytest -q"
          result: "post-review passed: 148 passed, 57 skipped (pre-existing Postgres-dependent tests skipped by the existing offline policy; unrelated to this task)"
      review_remediation:
        - "Sourcery (PR #7) found a real bug: a liquor_prices row with a null/missing price_per_ml_vnd was coerced to 0.0, marking the ingredient priced from liquor_prices_table while actually reporting a fabricated free price. Fixed to treat a missing price_per_ml_vnd exactly like no matching row: price stays unknown and is excluded/reported, never defaulted."
        - "Added AbvSource/PriceSource Literal types (replacing bare str) so the allowed provenance values are explicit and misuse is caught statically."
        - "Split the previously-conflated 'unknown' outcome into 'unknown' (lookup ran, found nothing -- a normal, expected gap) and 'lookup_error' (the lookup itself raised, e.g. a Redis/DB outage) via logger.exception, so an infrastructure failure is never silently indistinguishable from an ordinary missing-ingredient case."
        - "Narrowed the accepted input type from Sequence[Mapping[str, Any]] to Sequence[IngredientLineLike] = Sequence[IngredientLine | Mapping[str, Any]], matching what _extract_ingredient_fields actually supports, instead of a misleadingly narrow or fully unconstrained type."
      known_gap: "None functionally. RCP-03 still needs to wire a real IngredientRegistry (RCP-01) and call calculate_recipe_cost_and_abv() when persisting a RecipeVersion; this task only adds the calculator itself, per its planned_paths scope."
    handoff: "Stop at RCP-02 boundary; RCP-03 (recipe creation and listing API) remains planned."
