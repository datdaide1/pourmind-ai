name: CI

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci
          POSTGRES_DB: pourmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pourmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci
      POSTGRES_DB: pourmind_test
      POSTGRES_SSL: "false"
      SESSION_TOKEN_SECRET: ${{ github.sha }}-${{ github.run_id }}-session
      API_RATE_LIMIT_REQUESTS: 10000
      RUN_DB_TESTS: "1"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/agent-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Apply database schema
        run: |
          python - <<'PY'
          import asyncio
          from app.db.models import Base
          from app.db.postgres import engine
          async def main():
              async with engine.begin() as conn: await conn.run_sync(Base.metadata.create_all)
          asyncio.run(main())
          PY
      - name: Run backend tests
        run: python -m pytest tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
