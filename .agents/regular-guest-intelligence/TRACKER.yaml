        - "Unit resolution accepts only the five schema-approved units (ml, dash, drop, barspoon, piece) via a deterministic alias table (case, plural, spacing variants); unsupported units (oz, tsp, cl, ...) have no approved conversion factor in the spec and are never guessed-converted"
        - "Amount parsing accepts ints/floats, decimal strings and bartender-style fractions (1/2, 1 1/2) only; unparseable or out-of-range amounts are rejected without inventing precision"
        - "IngredientRegistry is an optional, caller-supplied case/whitespace/Unicode-form-insensitive lookup; normalized_ingredient_id is only ever set from an exact registry match, never invented"
        - "display_name is preserved verbatim (only whitespace-stripped) from the raw input, alongside the normalized unit/amount/id, matching the FND-02 IngredientLine contract"
        - "Lines that cannot be normalized (missing name, unrecognized unit, invalid/out-of-range amount) are excluded from the ingredient list and reported in a separate unresolved list plus a missing_data note, instead of being silently dropped or fabricated"
        - "Each raw line normalizes independently and in original order, so duplicate ingredient names in one recipe stay as separate lines"
      regression_coverage:
