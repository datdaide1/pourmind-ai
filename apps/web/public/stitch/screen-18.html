<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bar Copilot - Bespoke Quick Entry</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Libre+Caslon+Text:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-primary-container": "#554300",
                        "on-primary-fixed-variant": "#574500",
                        "surface-dim": "#121414",
                        "on-secondary-container": "#bab8b9",
                        "primary-fixed": "#ffe088",
                        "secondary": "#c8c6c7",
                        "outline-variant": "#4d4635",
                        "secondary-container": "#49494a",
                        "surface-bright": "#37393a",
                        "on-primary-fixed": "#241a00",
                        "on-surface": "#e2e2e2",
                        "surface-container-lowest": "#0c0f0f",
                        "on-tertiary": "#303031",
                        "surface-container-highest": "#333535",
                        "inverse-primary": "#735c00",
                        "tertiary-fixed-dim": "#c8c6c7",
                        "on-error": "#690005",
                        "on-error-container": "#ffdad6",
                        "surface-container": "#1e2020",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#1b1b1c",
                        "error-container": "#93000a",
                        "inverse-on-surface": "#2f3131",
                        "tertiary-fixed": "#e4e2e3",
                        "primary-fixed-dim": "#e9c349",
                        "surface-tint": "#e9c349",
                        "on-secondary": "#303031",
                        "on-primary": "#3c2f00",
                        "on-background": "#e2e2e2",
                        "secondary-fixed": "#e5e2e3",
                        "background": "#121414",
                        "secondary-fixed-dim": "#c8c6c7",
                        "tertiary-container": "#b4b2b3",
                        "on-tertiary-container": "#454546",
                        "surface-variant": "#333535",
                        "surface": "#121414",
                        "on-tertiary-fixed-variant": "#474648",
                        "primary-container": "#d4af37",
                        "primary": "#f2ca50",
                        "on-tertiary-fixed": "#1b1b1c",
                        "surface-container-low": "#1a1c1c",
                        "outline": "#99907c",
                        "on-secondary-fixed-variant": "#474647",
                        "surface-container-high": "#282a2b",
                        "on-surface-variant": "#d0c5af",
                        "inverse-surface": "#e2e2e2",
                        "tertiary": "#d0cdce"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "margin-mobile": "20px",
                        "margin-desktop": "64px",
                        "container-max": "1280px",
                        "gutter": "24px",
                        "unit": "8px"
                    },
                    fontFamily: {
                        "display-lg-mobile": ["Libre Caslon Text"],
                        "body-lg": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"],
                        "headline-sm": ["Libre Caslon Text"],
                        "display-lg": ["Libre Caslon Text"],
                        "label-sm": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "headline-md": ["Libre Caslon Text"]
                    },
                    fontSize: {
                        "display-lg-mobile": ["36px", { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "headline-sm": ["24px", { lineHeight: "32px", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-md": ["32px", { lineHeight: "40px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background: rgba(45, 45, 46, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .input-b2b {
            background-color: #2D2D2E;
            border: none;
            border-bottom: 1px solid #e2e2e2;
            color: #e2e2e2;
        }
        .input-b2b:focus {
            outline: none;
            border-bottom-color: #d4af37;
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen selection:bg-primary selection:text-on-primary">
<!-- Transactional Screen: Navigation Suppressed per rules -->
<main class="w-full h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop bg-[url('placeholder')] bg-cover bg-center" data-alt="A dark, intimate high-end speakeasy bar setting in the background, out of focus. Deep shadows contrast with subtle amber lighting illuminating rows of premium liquor bottles on glass shelves. The atmosphere is sophisticated and exclusive, emphasizing the Liquid Gold dark mode aesthetic with rich blacks and warm gold highlights. The scene feels premium and professional, perfect for a high-end mixology platform background." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAdlBViUq4Fzw0bJiwdu5l9cbj1SyG1eZs_I4AW3ynCSCHQL7KeSab1m5SKvx039k0Pqdy3YZT8Z_5yWKdyTnNf6zSfIDnpAEfM5Wy7QZvIE_KFe2mRiu5dxC_fed2ZjGPnm4_G231VhxI2bLeTeXmwl_h-kcdqXNwa6rYXt9oe_esMfdv6NP7Yr91eDs_2dvdy_DRFAf3TFzpURweoOpT-rmFYUSdlKrcL6NqkcwtM6ocdKO_6W_NiaA')">
<div class="glass-card rounded-xl p-6 md:p-10 w-full max-w-2xl relative shadow-2xl">
<!-- Close Action (Task-Focused) -->
<button aria-label="Close" class="absolute top-4 right-4 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<!-- Header -->
<div class="mb-8">
<h1 class="font-headline-md text-headline-md text-primary mb-2">Bespoke Quick Entry</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Log an off-menu creation for the current service.</p>
</div>
<form class="space-y-6">
<!-- Guest Association -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="guestSearch">Record for Guest (Optional)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-on-surface-variant">search</span>
<input class="input-b2b w-full pl-10 py-3 font-body-lg text-body-lg" id="guestSearch" placeholder="Search by name or table..." type="text"/>
</div>
</div>
<!-- Spirit & Flavor Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="baseSpirit">Base Spirit</label>
<select class="input-b2b w-full py-3 font-body-lg text-body-lg appearance-none bg-surface-container" id="baseSpirit">
<option disabled="" selected="" value="">Select Spirit...</option>
<option value="bourbon">Bourbon</option>
<option value="gin">Gin</option>
<option value="mezcal">Mezcal</option>
<option value="rum">Rum</option>
<option value="tequila">Tequila</option>
<option value="vodka">Vodka</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-[calc(50%+4px)] transform -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="primaryFlavors">Primary Flavors</label>
<input class="input-b2b w-full py-3 font-body-lg text-body-lg" id="primaryFlavors" placeholder="e.g., Smoky, Citrus, Herbal" type="text"/>
<div class="flex flex-wrap gap-2 mt-2">
<span class="bg-surface-container px-2 py-1 rounded text-label-sm font-label-sm text-on-surface cursor-pointer hover:bg-surface-bright">Smoky</span>
<span class="bg-surface-container px-2 py-1 rounded text-label-sm font-label-sm text-on-surface cursor-pointer hover:bg-surface-bright">Citrus</span>
<span class="bg-surface-container px-2 py-1 rounded text-label-sm font-label-sm text-on-surface cursor-pointer hover:bg-surface-bright">Herbal</span>
<span class="bg-surface-container px-2 py-1 rounded text-label-sm font-label-sm text-on-surface cursor-pointer hover:bg-surface-bright">Floral</span>
</div>
</div>
</div>
<!-- Modifications -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="modifications">Modifications / Notes</label>
<textarea class="input-b2b w-full py-3 font-body-lg text-body-lg resize-none" id="modifications" placeholder="Rinse glass, double strain, specific garnish..." rows="2"></textarea>
</div>
<!-- Price Entry (Transactional Requirement) -->
<div class="space-y-2 w-1/3 min-w-[120px]">
<label class="block font-label-md text-label-md text-on-surface-variant" for="price">Price</label>
<div class="relative">
<span class="absolute left-0 top-1/2 transform -translate-y-1/2 text-on-surface-variant font-body-lg text-body-lg">$</span>
<input class="input-b2b w-full pl-6 py-3 font-body-lg text-body-lg" id="price" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Save Toggle & Actions -->
<div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6 pt-4 mt-6 border-t border-primary/20">
<label class="flex items-center cursor-pointer group">
<div class="relative">
<input class="sr-only" id="saveRecipe" type="checkbox"/>
<div class="block bg-surface-container-highest w-10 h-6 rounded-full border border-outline-variant transition-colors group-hover:border-primary/50"></div>
<div class="dot absolute left-1 top-1 bg-on-surface-variant w-4 h-4 rounded-full transition transform group-hover:bg-primary"></div>
</div>
<div class="ml-3 font-label-md text-label-md text-on-surface">
                            Save as House Recipe
                        </div>
</label>
<div class="flex gap-4 w-full md:w-auto">
<button class="px-6 py-3 border border-primary/20 text-primary font-label-md text-label-md rounded hover:bg-primary/10 transition-colors w-full md:w-auto" type="button">
                            Cancel
                        </button>
<button class="px-6 py-3 bg-primary-container text-on-primary-container font-label-md text-label-md rounded hover:bg-primary-fixed-dim transition-colors shadow-[0_0_15px_rgba(212,175,55,0.1)] w-full md:w-auto" type="submit">
                            Log Entry
                        </button>
</div>
</div>
</form>
</div>
</main>
<script>
        // Simple toggle interaction for visual feedback
        const toggleInput = document.getElementById('saveRecipe');
        const toggleBg = toggleInput.nextElementSibling;
        const toggleDot = toggleBg.nextElementSibling;

        toggleInput.addEventListener('change', function() {
            if (this.checked) {
                toggleBg.classList.replace('bg-surface-container-highest', 'bg-primary-container');
                toggleDot.classList.replace('translate-x-0', 'translate-x-4');
                toggleDot.classList.replace('bg-on-surface-variant', 'bg-on-primary-container');
            } else {
                toggleBg.classList.replace('bg-primary-container', 'bg-surface-container-highest');
                toggleDot.classList.replace('translate-x-4', 'translate-x-0');
                toggleDot.classList.replace('bg-on-primary-container', 'bg-on-surface-variant');
            }
        });
    </script>
</body></html>
